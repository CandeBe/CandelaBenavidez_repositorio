<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="Curriculum, Candela Benavidez, CV, experiencia laboral, perfil profesional">
    <title>Contacto - Curriculum Benavidez Candela</title>
    <link href="estilos.css" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>

<body>
    <header>
        <nav>
            <img src="img/logo_header.png" alt="Logo de Candela" width="60" height="60" class="logo">
            <ul>
                <li><a href="index.html">Sobre mí</a></li>
                <li><a href="galeria.html">Galería</a></li>
                <li><a href="experiencia_estudios.html">Experiencia y estudios</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contacto-contenedor">
            <div class="contacto-grafico">
                <h3 class="contacto-titulo">Trabajemos juntos</h3>
                <div class="grafico-forma">
                    <img src="img/sonrrisa-contacto.svg" alt="Forma gráfica de marca" width="400" height="200">
                </div>
            </div>
            <div class="contacto-formulario-bloque">
                <form method="POST" action="mailto:dconalmaestudio@gmail.com" target="_blank" enctype="text/plain" class="formulario-contacto">
                    <div class="form-grupo">
                        <label for="email">Mail</label>
                        <input type="email" id="email" name="email" placeholder="Escribe tu correo..." required>
                    </div>
                    <div class="form-grupo">
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" name="asunto" placeholder="Nombre del proyecto..." required>
                    </div>
                    <div class="form-grupo">
                        <label>¿Qué proyecto tenés en mente?</label>
                        <div class="opciones-checkbox">
                            <label class="checkbox-label">
                                <input type="checkbox" name="servicio" value="branding"> Identidad de marca
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="servicio" value="arte"> Dirección de arte
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="servicio" value="digital"> Diseño digital
                            </label>
                        </div>
                    </div>
                    <div class="form-grupo">
                        <label for="mensaje">Contame tu proyecto</label>
                        <textarea id="mensaje" name="mensaje" rows="5" placeholder="En que te puedo ayudar?" required></textarea>
                    </div>
                    <div class="form-boton-contenedor">
                        <button type="submit" class="boton-hablemos">Hablemos</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <div class="derechos-reservados">
            <p>2025 Candela | Todos los derechos reservados</p>
        </div>
        <div class="redes">
            <a href="https://www.instagram.com/candelabenavidezz/" target="_blank">
                <img src="img/icono-instagram.png" alt="Instagram" width="50" height="50">
            </a>
            <a href="https://www.linkedin.com/in/candelabe" target="_blank">
                <img src="img/icono-linkedin.png" alt="Instagram" width="50" height="50">
            </a>
            <a href="https://www.behance.net/candelabenavid" target="_blank">
                <img src="img/icono-behance.png" alt="Instagram" width="50" height="50">
            </a>
        </div>
    </footer>
</body>
